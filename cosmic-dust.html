<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlueHaven — Cosmic Dust</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.143.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.143.0/examples/jsm/"}}</script>
</head>
<body><canvas id="scene"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
import { CopyShader } from 'three/addons/shaders/CopyShader.js';

const LAYERS={NONE:0,TORUS_SCENE:1,BLOOM_SCENE:2,ENTIRE_SCENE:3};
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGL1Renderer({canvas,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.Fog(0x000000,0,22);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,80);camera.position.set(0,0,3);scene.add(camera);
camera.layers.enable(LAYERS.TORUS_SCENE);camera.layers.enable(LAYERS.BLOOM_SCENE);camera.layers.enable(LAYERS.ENTIRE_SCENE);
function hexToVec3(hex){const n=parseInt(hex.slice(1),16);return new THREE.Vector3(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255)}
const count=940,positions=[],sizes=[];for(let i=0;i<count;i++){positions.push(2*Math.random()-1,2*Math.random()-1,2*Math.random()-1);sizes.push(25+25*Math.random())}
const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setAttribute('size',new THREE.Float32BufferAttribute(sizes,1));
const uniforms={iTime:{value:0},iShift:{value:new THREE.Vector3()},iAlpha:{value:0},iAnimation:{value:new THREE.Vector3(0,0,0)},iResolution:{value:{x:innerWidth*devicePixelRatio,y:innerHeight*devicePixelRatio}},uDepth:{value:3.7},uCool:{value:hexToVec3('#b3401f')},uWarm:{value:hexToVec3('#ffc46b')}};
const material=new THREE.ShaderMaterial({transparent:true,stencilWrite:false,uniforms,vertexShader:`attribute float size;
uniform float iTime; uniform vec3 iShift; uniform vec2 iResolution; uniform vec3 iAnimation; uniform float uDepth;
varying float transparency; varying float warmness;
vec3 warp3d(vec3 pos,float t){float curv=.9,a=1.9,b=.25,b2=.03,c=.02;pos*=2.;pos.x+=curv*sin(c*t+a*pos.y)+t*b2;pos.y+=curv*cos(c*t+a*pos.x);pos.z+=curv*cos(c*t+a*pos.y);pos.z+=curv*sin(c*t+a*pos.x)+t*b;pos.z=abs(pos.z);return pos.xyz;}
void main(){vec3 v=warp3d(position,iTime);v=uDepth*(2.*fract(v+iShift)-1.)+iAnimation;vec4 vpos=modelViewMatrix*vec4(v,1.);transparency=step(length(v),uDepth);warmness=step(.75,fract(size*7.13));gl_PointSize=size*iResolution.y/1000./-vpos.z;gl_Position=projectionMatrix*vpos;}`,
fragmentShader:`varying float transparency; varying float warmness;
uniform float iAlpha; uniform vec3 uCool; uniform vec3 uWarm;
void main(){vec3 color=mix(uCool*.8,uWarm*.8,warmness);float tex=smoothstep(1.,.3,length(2.*gl_PointCoord-1.));gl_FragColor=vec4(tex*color,tex*transparency*iAlpha);}`});
const points=new THREE.Points(geometry,material);points.position.set(0,0,-1);points.layers.enable(LAYERS.ENTIRE_SCENE);scene.add(points);
const renderPass=new RenderPass(scene,camera);
const torusComposer=new EffectComposer(renderer);torusComposer.renderToScreen=false;torusComposer.addPass(renderPass);torusComposer.addPass(new ShaderPass(GammaCorrectionShader));torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.3,0));torusComposer.addPass(new ShaderPass(CopyShader));
const bloomComposer=new EffectComposer(renderer);bloomComposer.renderToScreen=false;bloomComposer.addPass(renderPass);bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.7,0));bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));
const FinalPass={uniforms:{iTime:{value:0},tDiffuse:{value:null},torusTexture:{value:null},bloomTexture:{value:null},haloTexture:{value:null},uBg:{value:hexToVec3('#1a0a04')},uFlameA:{value:hexToVec3('#ff7a2a')},uFlameB:{value:hexToVec3('#ffce5a')},uFlameAmt:{value:.2}},vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,fragmentShader:`uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos,float t){float curv=.8,a=1.9,b=.7;pos*=2.;pos.x+=curv*sin(t+a*pos.y)+t*b;pos.y+=curv*cos(t+a*pos.x);pos.y+=curv*sin(t+a*pos.z)+t*b;pos.z+=curv*cos(t+a*pos.y);pos.z+=curv*sin(t+a*pos.x)+t*b;pos.x+=curv*cos(t+a*pos.z);return .5+.5*cos(pos.xyz+vec3(1,2,4));}
void main(){vec2 uv=2.*vUv-1.;vec3 w=pow(warp3d(vec3(uv.x,sin(uv.y),uv.y),iTime*1.5),vec3(1.5));vec3 flame=1.5*uFlameA*w.x;flame*=w.y;flame+=uFlameB*w.z;flame*=smoothstep(.25,1.,abs(uv.y));float md=smoothstep(-.7,1.,-uv.y*uv.x);flame*=md*md;vec3 bg=uBg*(1.-.4*length(uv));vec3 halo=texture2D(haloTexture,vUv).xyz;gl_FragColor=vec4(bg+flame*uFlameAmt+texture2D(bloomTexture,vUv).xyz+texture2D(torusTexture,vUv).xyz+texture2D(tDiffuse,vUv).xyz+halo,1.);}`};
const finalComposer=new EffectComposer(renderer);finalComposer.addPass(renderPass);const finalPass=new ShaderPass(FinalPass);finalPass.uniforms.bloomTexture.value=bloomComposer.renderTarget1.texture;finalPass.uniforms.torusTexture.value=torusComposer.renderTarget1.texture;finalComposer.addPass(finalPass);
const flyPoints={render(){uniforms.iTime.value=performance.now()/1000;uniforms.iShift.value.add(camera.position.clone().multiplyScalar(.0022*.4))}};
const start=performance.now();function appearIn(now){const t=Math.min(1,(now-start)/2200),e=t*t*t*(t*(t*6-15)+10);uniforms.iAlpha.value=e*.68;if(t<1)requestAnimationFrame(appearIn)}requestAnimationFrame(appearIn);
function resize(){const w=innerWidth,h=innerHeight,dpr=devicePixelRatio;renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();for(const c of [torusComposer,bloomComposer,finalComposer]){c.setPixelRatio(dpr);c.setSize(w,h)}uniforms.iResolution.value={x:w*dpr,y:h*dpr}}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);finalPass.uniforms.iTime.value=performance.now()/1000;flyPoints.render();camera.layers.set(LAYERS.TORUS_SCENE);torusComposer.render();camera.layers.set(LAYERS.BLOOM_SCENE);bloomComposer.render();camera.layers.set(LAYERS.ENTIRE_SCENE);finalComposer.render()}animate();
</script></body></html>
