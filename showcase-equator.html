<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showcase Equator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#f7f7f2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100%;overflow-x:hidden}.page{height:520vh}.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,#252525 0,#101010 38%,#050505 100%)}.stage:before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at center,transparent 28%,rgba(255,255,255,.035) 54%,transparent 70%);pointer-events:none}.equator{position:relative;width:min(1160px,92vw);height:min(720px,78vh);display:grid;grid-template-columns:240px 1fr;gap:clamp(28px,6vw,90px);align-items:center}.pills{display:flex;flex-direction:column;gap:12px;z-index:10}.pill{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:rgba(255,255,255,.58);border-radius:999px;padding:14px 20px;text-align:left;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.45s cubic-bezier(.2,.8,.2,1);transform-origin:right center}.pill:hover{color:#fff;background:rgba(255,255,255,.12)}.pill.active{background:#fff;color:#111;border-color:#fff;transform:translateX(18px) scale(1.03);box-shadow:0 10px 40px rgba(255,255,255,.08)}.deck{height:100%;min-height:540px;position:relative;display:grid;place-items:center;perspective:1200px;touch-action:none;cursor:grab}.deck.dragging{cursor:grabbing}.card{position:absolute;width:min(520px,68vw);aspect-ratio:1.34/1;border-radius:28px;overflow:hidden;will-change:transform,opacity;box-shadow:0 30px 90px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);user-select:none}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 30%,transparent 70%,rgba(0,0,0,.32));mix-blend-mode:screen;opacity:.45}.marble{position:absolute;inset:-15%;background:radial-gradient(ellipse at 20% 25%,rgba(255,255,255,.8),transparent 16%),radial-gradient(ellipse at 75% 70%,rgba(255,255,255,.34),transparent 20%),repeating-radial-gradient(ellipse at 40% 55%,rgba(255,255,255,.15) 0 7px,rgba(0,0,0,.16) 9px 18px),linear-gradient(135deg,#252525,#777,#161616,#b1b1b1,#292929);filter:contrast(1.35) saturate(.7);transform:rotate(-12deg) scale(1.25)}.card:nth-child(2) .marble{filter:hue-rotate(170deg) contrast(1.25) saturate(.75);background:repeating-radial-gradient(ellipse at 55% 45%,rgba(255,255,255,.18) 0 8px,rgba(0,0,0,.2) 10px 19px),linear-gradient(135deg,#162d34,#6e9aa0,#102126,#a9d4d2)}.card:nth-child(3) .marble{filter:hue-rotate(250deg) contrast(1.3) saturate(.75);background:repeating-radial-gradient(ellipse at 45% 60%,rgba(255,255,255,.2) 0 6px,rgba(0,0,0,.18) 8px 17px),linear-gradient(135deg,#34213d,#9979a9,#211126,#d1b6d4)}.card:nth-child(4) .marble{filter:hue-rotate(25deg) contrast(1.25) saturate(.8);background:repeating-radial-gradient(ellipse at 55% 50%,rgba(255,255,255,.2) 0 9px,rgba(0,0,0,.16) 11px 20px),linear-gradient(135deg,#3d2a16,#a88c61,#19130d,#d5c6a5)}.cardContent{position:absolute;inset:0;padding:34px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}.title{font-size:clamp(36px,5vw,76px);font-weight:600;letter-spacing:-.055em;line-height:.9;max-width:80%}.meta{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}.counter{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:10px;letter-spacing:.2em;opacity:.4;writing-mode:vertical-rl}.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none}@media(max-width:760px){.equator{grid-template-columns:1fr;gap:22px;height:90vh}.pills{position:absolute;left:0;right:0;bottom:0;flex-direction:row;overflow:auto;padding:8px 4px;z-index:20}.pill{white-space:nowrap;padding:11px 15px}.pill.active{transform:translateY(-5px)}.deck{min-height:0;height:70vh}.card{width:78vw}.counter{display:none}}
</style>
</head>
<body>
<div class="page"></div>
<main class="stage" id="stage">
  <section class="equator" aria-label="Showcase Equator">
    <nav class="pills" id="pills"></nav>
    <div class="deck" id="deck" aria-label="Showcase cards"></div>
    <div class="counter" id="counter">01 / 06</div>
  </section>
</main>
<div class="hint">scroll · flick · drag</div>
<script>
const items=[
  {name:'Identity',label:'01',tone:'identity'},
  {name:'Digital',label:'02',tone:'digital'},
  {name:'Motion',label:'03',tone:'motion'},
  {name:'Editorial',label:'04',tone:'editorial'},
  {name:'Culture',label:'05',tone:'culture'},
  {name:'Archive',label:'06',tone:'archive'}
];
const pills=document.getElementById('pills'),deck=document.getElementById('deck'),counter=document.getElementById('counter');
const cards=[];let active=0,target=0,scrollProgress=0,dragging=false,startX=0,lastX=0,velocity=0,lastScroll=scrollY;
items.forEach((item,i)=>{
  const p=document.createElement('button');p.className='pill';p.textContent=item.name;p.dataset.index=i;p.onclick=()=>{target=i;sync(true)};pills.appendChild(p);
  const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="marble"></div><div class="cardContent"><div class="eyebrow">Showcase Equator · ${item.label}</div><div class="title">${item.name}</div><div class="meta"><span>Selected work</span><span>${item.label}</span></div></div>`;deck.appendChild(c);cards.push(c)
});
function mod(n,m){return ((n%m)+m)%m}
function sync(force=false){active=Math.round(target);items.forEach((_,i)=>pills.children[i].classList.toggle('active',i===active));counter.textContent=`${String(active+1).padStart(2,'0')} / ${String(items.length).padStart(2,'0')}`;if(force)window.scrollTo({top:(active/(items.length-1))* (document.documentElement.scrollHeight-innerHeight),behavior:'smooth'})}
function layout(){cards.forEach((c,i)=>{let d=i-target;while(d>items.length/2)d-=items.length;while(d<-items.length/2)d+=items.length;const ad=Math.abs(d);const x=d*42;const y=ad*18;const z=-ad*95;const rot=d*3.5;const scale=Math.max(.78,1-ad*.055);c.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(${rot}deg) scale(${scale})`;c.style.opacity=ad>3?.08:Math.max(.12,1-ad*.22);c.style.zIndex=100-Math.round(ad*10)})}
function fromScroll(){const max=document.documentElement.scrollHeight-innerHeight;scrollProgress=max>0?scrollY/max:0;target=scrollProgress*(items.length-1);sync();}
window.addEventListener('scroll',fromScroll,{passive:true});window.addEventListener('resize',layout);
deck.addEventListener('pointerdown',e=>{dragging=true;startX=lastX=e.clientX;velocity=0;deck.classList.add('dragging');deck.setPointerCapture(e.pointerId)});
deck.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;velocity=dx;target-=dx/120;target=Math.max(0,Math.min(items.length-1,target));layout()});
deck.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;deck.classList.remove('dragging');target=Math.round(target-(velocity>0?.12:velocity<0?-.12:0));target=Math.max(0,Math.min(items.length-1,target));sync(true)});
deck.addEventListener('pointercancel',()=>{dragging=false;deck.classList.remove('dragging')});
let wheelLock=false;window.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<2||wheelLock)return;wheelLock=true;target=Math.max(0,Math.min(items.length-1,target+(e.deltaY>0?1:-1)));sync(true);setTimeout(()=>wheelLock=false,420)},{passive:true});
function tick(){if(!dragging){const max=document.documentElement.scrollHeight-innerHeight;const desired=max>0?scrollY/max*(items.length-1):0;target+=(desired-target)*.08}layout();requestAnimationFrame(tick)}
sync(true);layout();tick();
</script>
</body>
</html>
