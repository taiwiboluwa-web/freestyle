*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;min-height:100vh;overflow:hidden;position:relative}.video-container{position:fixed;inset:auto 0 0;width:100vw;height:90vh;overflow:hidden;z-index:-1}.video-container video{width:100%;height:110%;object-fit:cover;display:block}.video-container:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -15%,#000 0%,rgba(0,0,0,.92) 24%,rgba(0,0,0,.15) 70%,rgba(0,0,0,.2));pointer-events:none}#top-gradient{position:fixed;top:-30vh;left:0;width:100vw;z-index:0;pointer-events:none}.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6vh;width:95%;max-width:1100px;margin:auto}.eyebrow{font:500 .78rem 'Outfit',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#39ff14;margin-bottom:1rem}.hero-title{font:400 2.8rem/1.15 'Playfair Display',Georgia,serif;letter-spacing:-.015em;text-shadow:0 4px 30px #000;margin-bottom:2.2rem}.hero-btn{font:500 1.1rem 'Outfit',sans-serif;letter-spacing:.02em;color:#fff;background:#000;border:1px solid rgba(255,255,255,.18);padding:1.3rem 2.5rem;border-radius:9999px;display:inline-flex;align-items:center;gap:.9rem;cursor:pointer;transition:.3s}.hero-btn:hover{background:#fff;color:#000;transform:translateY(-2px)}.blinking-dot{width:10px;height:10px;background:#39ff14;border-radius:50%;position:relative;animation:pulse 2s infinite}.blinking-dot:after{content:"";position:absolute;inset:-5px;background:rgba(57,255,20,.45);border-radius:50%;animation:wave 2s infinite}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85);box-shadow:0 0 4px rgba(57,255,20,.3)}50%{opacity:1;transform:scale(1.1);box-shadow:0 0 12px rgba(57,255,20,.9)}}@keyframes wave{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}.footer-container{position:fixed;top:50vh;left:20px;right:20px;width:calc(100vw - 40px);transform:translateY(-50%);z-index:3;display:flex;flex-direction:column}.footer-top{display:flex;justify-content:space-between;align-items:flex-end}.footer-title{font:400 1.4rem 'General Sans',sans-serif}.footer-divider{border:0;height:1px;background:rgba(255,255,255,.2);margin:1.6rem 0}.footer-bottom{display:flex;justify-content:space-between;align-items:center}.footer-socials{display:flex;gap:1.25rem;flex:1}.social-icon{color:rgba(255,255,255,.55);transition:.3s;display:inline-flex}.social-icon:hover{color:#39ff14;transform:translateY(-2px)}.footer-links{display:flex;gap:2.8rem;justify-content:center;flex:2}.footer-link{font:400 .95rem 'Outfit',sans-serif;color:#fff;text-decoration:none}.footer-link:hover{color:#39ff14}.footer-copyright{font:400 .95rem 'Outfit',sans-serif;color:rgba(255,255,255,.45);text-align:right;flex:1}.footer-logo-wrap{position:fixed;bottom:20px;left:0;right:0;width:100%;padding:0 20px;display:flex;justify-content:center;z-index:3}.footer-logo-text{font:400 21.9vw/.8 'General Sans',sans-serif;color:#fff;letter-spacing:-.03em;transform:translateX(-20px);opacity:.95;white-space:nowrap}.glass-cursor-card,.cursor-ring-outline{position:fixed;top:0;left:0;pointer-events:none;will-change:transform,opacity}.glass-cursor-card{z-index:99999;padding:.75rem 1.5rem;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:9999px;transform:translate(-50%,-50%) scale(0);opacity:0}.glass-cursor-card.active{opacity:1}.cursor-card-text{font:500 .85rem 'General Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#39ff14}.text-white{color:#fff}.cursor-ring-outline{width:48px;height:48px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;z-index:99998;transform:translate(-50%,-50%) scale(0);opacity:0;transition:border-color .4s}.cursor-ring-outline.active{opacity:1}.cursor-ring-outline.expanded{border-color:rgba(255,255,255,.15)}@media(max-width:700px){.hero-title{font-size:2rem}.footer-container{top:47%}.footer-top{gap:1rem}.footer-title{font-size:1rem}.footer-bottom{flex-wrap:wrap;gap:1.5rem}.footer-links{order:3;flex-basis:100%;gap:1rem;justify-content:flex-start}.footer-copyright{font-size:.75rem}.footer-logo-text{font-size:21vw}.glass-cursor-card,.cursor-ring-outline{display:none}}

<script>document.addEventListener('DOMContentLoaded',()=>{const logo=document.querySelector('.footer-logo-text');[...logo.textContent].forEach((c,i)=>{const w=document.createElement('span'),s=document.createElement('span');w.style.cssText='display:inline-block;overflow:hidden;vertical-align:bottom';s.textContent=c===' '?' ':c;s.style.cssText='display:inline-block;opacity:0;transform:translateX(-105%);filter:blur(20px);animation:reveal 1.2s cubic-bezier(.05,.9,.1,1) forwards';s.style.animationDelay=i*.09+'s';w.appendChild(s);logo.appendChild(w)});logo.childNodes[0]?.remove();const title=document.querySelector('.hero-title');title.innerHTML=title.innerHTML.split(/(\s+|<br\s*\/?\>)/i).map(p=>p.trim()===''?' ':p.toLowerCase().startsWith('<br')?'<br>':`<span style="display:inline-block;overflow:hidden;vertical-align:bottom"><span style="display:inline-block;opacity:0;transform:translateY(105%);filter:blur(20px);animation:word 1.3s cubic-bezier(.05,.9,.1,1) forwards;animation-delay:${[...title.textContent.matchAll(/\S+/g)].findIndex(x=>x[0]===p)*.1}s">${p}</span></span>`).join('');const card=document.getElementById('glass-card'),ring=document.getElementById('cursor-ring');let x=innerWidth/2,y=innerHeight/2,cx=x,cy=y,scale=0;document.addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;card.classList.add('active');ring.classList.add('active');scale=1});function tick(){cx+=(x-cx)*.08;cy+=(y-cy)*.08;card.style.transform=`translate3d(${cx}px,${cy}px,0) translate(-50%,-50%) scale(${scale})`;ring.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${scale})`;requestAnimationFrame(tick)}tick();document.querySelector('.hero-btn').addEventListener('mouseenter',()=>{scale=0;ring.classList.add('expanded')});document.querySelector('.hero-btn').addEventListener('mouseleave',()=>{scale=1;ring.classList.remove('expanded')})});const st=document.createElement('style');st.textContent='@keyframes reveal{to{opacity:.95;transform:translateX(0);filter:blur(0)}}@keyframes word{to{opacity:1;transform:translateY(0);filter:blur(0)}}';document.head.appendChild(st);</script></body></html>
